name: pay-by-bank

x-go: &go
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pay}
      POSTGRES_DB: ${POSTGRES_DB:-pay}
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay}"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233", "--log-level", "warn"]
    ports: ["7233:7233", "8233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: api } }
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://pay:pay@postgres:5432/pay?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  mockbank:
    <<: *go
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: mockbank } }
    environment:
      MOCKBANK_FAIL_RATE: ${MOCKBANK_FAIL_RATE:-0.5}
    ports: ["8081:8081"]

  receiver:
    <<: *go
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: receiver } }
    environment:
      WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-whsec_demo_local_only}
    ports: ["8082:8082"]

  api:
    <<: *go
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: api } }
    environment:
      DATABASE_URL: postgres://pay:pay@postgres:5432/pay?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      CHECKOUT_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  worker:
    <<: *go
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: worker } }
    environment:
      DATABASE_URL: postgres://pay:pay@postgres:5432/pay?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      MOCKBANK_URL: http://mockbank:8081
      RISK_LIMIT_MINOR: ${RISK_LIMIT_MINOR:-1000000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  checkout:
    build: { context: ., dockerfile: web/checkout/Dockerfile }
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://localhost:8080/api
      ORIGIN: http://localhost:3000
      PORT: "3000"
    ports: ["3000:3000"]

  dashboard:
    build:
      context: .
      dockerfile: web/dashboard/Dockerfile
      args: { VITE_API_URL: http://localhost:8080/api }
    restart: unless-stopped
    ports: ["5173:80"]
