name: ci

on:
  push:
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1
      - run: buf lint
      - name: buf breaking (pull requests)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main,subdir=proto' || true
      - name: buf generate leaves no diff
        run: |
          buf generate
          git diff --exit-code -- gen

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env: { POSTGRES_USER: pay, POSTGRES_PASSWORD: pay, POSTGRES_DB: pay }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pay" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
        env:
          DATABASE_URL: postgres://pay:pay@localhost:5433/pay?sslmode=disable

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pay/checkout check
      - run: pnpm --filter @pay/checkout test
      - run: pnpm --filter @pay/checkout build
      - run: pnpm --filter @pay/dashboard check
      - run: pnpm --filter @pay/dashboard test
      - run: pnpm --filter @pay/dashboard build

  e2e:
    runs-on: ubuntu-latest
    needs: [proto, go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pay/e2e exec playwright install --with-deps chromium
      - run: ./scripts/dev-up.sh
      - run: cd e2e && PW_REPORT_DIR=$PWD/report pnpm exec playwright test
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/report }
